<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c3a"><title>2026 臺灣閱讀節｜文學高手榜</title>
<style>
:root{--bg:#092925;--panel:#173d37;--gold:#f3d28e;--muted:#aac7bc;--white:#f6f7ee;--line:#ffffff1c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#225c51 0,#0b302b 55%,#071c1a 100%);color:var(--white);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh}button,a{font:inherit}a{color:inherit}.screen{width:min(1550px,96%);margin:0 auto;padding:18px 0 14px;display:flex;flex-direction:column;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 5px 14px;border-bottom:1px solid #ffffff30}.brand{font-weight:800;letter-spacing:.12em;font-size:clamp(13px,1.25vw,19px)}.tools{display:flex;align-items:center;gap:9px}.tools button,.tools a{border:1px solid #a0d2c46b;border-radius:9px;background:#ffffff0f;color:#f0f7ec;padding:8px 12px;text-decoration:none;cursor:pointer;font-size:13px;font-weight:700}.tools button:hover{background:#ffffff22}.hero{padding:12px 2px 14px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:clamp(12px,1.3vw,17px);letter-spacing:.16em;color:var(--gold);font-weight:800}.hero h1{font-size:clamp(30px,4.4vw,64px);margin:1px 0;line-height:1.22}.hint{color:#b9d4c8;font-size:clamp(12px,1.2vw,16px)}.clock{color:#e9d6a9;font-size:clamp(13px,1.2vw,17px);font-variant-numeric:tabular-nums}.board{background:#f9f5e9;color:#253c34;border-radius:22px;padding:clamp(16px,2.25vw,29px);flex:1;min-height:340px;box-shadow:0 18px 60px #0005}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.heading h2{margin:0;font-size:clamp(19px,2vw,29px)}.pageinfo{color:#617368;font-size:clamp(12px,1.1vw,15px);font-weight:700}.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;align-items:stretch}.podium-item{text-align:center;background:#eaf2e9;border:1px solid #d6e6d8;border-radius:17px;padding:20px 8px}.podium-item:first-child{background:#fff1cd;border-color:#d8b876}.medal{font-size:clamp(34px,3.5vw,52px);line-height:1.15}.pname{font-size:clamp(19px,2.05vw,31px);font-weight:900;overflow-wrap:anywhere;margin:7px 0 2px}.pscore{font-size:clamp(22px,2.8vw,40px);font-weight:900;color:#2b684e}.extra{font-size:clamp(12px,1.05vw,15px);color:#647365}.rows{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.rows th{text-align:left;color:#718076;font-size:clamp(12px,1.12vw,17px);padding:6px 12px;border-bottom:2px solid #d9ddcf}.rows td{font-size:clamp(15px,1.55vw,23px);padding:clamp(6px,.75vh,11px) 12px;border-bottom:1px solid #dfe5dc;font-weight:650}.rows tr:nth-child(even){background:#f0f3ec}.rows .rank{width:80px;font-weight:900;color:#9a6b26}.rows .score{text-align:right;color:#23634c;font-weight:900}.rows th:last-child{text-align:right}.rows .name{max-width:300px;overflow-wrap:anywhere}.empty{text-align:center;padding:90px 0;color:#62766c;font-size:22px}.status{font-size:12px;color:#a9c8bd}.status.error{color:#ffd38a}.foot{display:flex;justify-content:space-between;gap:15px;align-items:center;color:#a5c8b8;font-size:clamp(12px,1.05vw,16px);padding:12px 5px 0}.progress{height:4px;background:#ffffff18;border-radius:20px;overflow:hidden;margin-top:8px}.progress div{height:100%;width:0;background:var(--gold)}@media(max-width:650px){.tools a{display:none}.hero{align-items:start;flex-direction:column;gap:2px}.podium{gap:6px}.podium-item{padding:14px 6px}.rows td,.rows th{padding:8px 4px}.rows .rank{width:45px}.foot{flex-wrap:wrap}.top{align-items:start}.brand{padding-top:7px}}
</style></head><body><div class="screen"><header class="top"><div class="brand">2026 臺灣閱讀節｜文學 FUN 樂園，JOY 玩科技</div><div class="tools"><a href="../">返回入口</a><button id="pause">暫停輪播</button><button id="refresh">立即更新</button><button id="full">全螢幕</button></div></header><div class="hero"><div><div class="eyebrow">🏆 文學高手挑戰榜</div><h1 id="title">《詩情畫意》排行榜</h1><div class="hint" id="subtitle">三題組共用排名・前20名</div></div><div class="clock"><span id="last">等待讀取雲端成績</span></div></div><main class="board"><div class="heading"><h2 id="board-title">🥇 文學前三名</h2><span class="pageinfo" id="count">雲端同步中</span></div><div id="content"><div class="empty">排行榜載入中……</div></div></main><footer class="foot"><div id="status" role="status">正在連線</div><div id="slide">1 / 6</div><div>掃描現場 QR Code，挑戰自己的文學紀錄！</div></footer><div class="progress"><div id="bar"></div></div></div>
<script>
'use strict';
// 取自本次提供的兩款活動版首頁，僅使用可公開的 Supabase publishable key。
const API='https://qxgysajhvqjpogrsutyf.supabase.co';
const KEY='sb_publishable_TvmZX_hhWXlQlxEQ4ejz5Q_UOnwedVP';
const INTERVAL=20000; // 每張榜單停留 20 秒
const REFRESH=60000; // 每 60 秒更新資料
const topicNames={moon:'月下風情',follow:'花意盎然',farewell:'送別依依'};
const chapterNames={room:'陋室銘',child:'兒時記趣'};
const slides=[{game:'poetic',type:'podium'},{game:'poetic',type:'list',start:0},{game:'poetic',type:'list',start:10},{game:'shuowen',type:'podium'},{game:'shuowen',type:'list',start:0},{game:'shuowen',type:'list',start:10}];
const $=id=>document.getElementById(id);
const state={poetic:[],shuowen:[],errors:{},updated:null,index:0,paused:false,lastSwitch:Date.now(),busy:false};
function tag(name,cls,text){const e=document.createElement(name);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function fetchJson(path){return fetch(API+'/rest/v1/'+path,{headers:{apikey:KEY,Accept:'application/json'},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})}
async function sync(){if(state.busy)return;state.busy=true;const paths={poetic:'poetic_festival_best_scores?select=rank,player_name,topic_id,score_tenths,total_ms&order=rank.asc&limit=20',shuowen:'rf_sw_leaderboard?select=player_name,game_id,total_score,achieved_at&order=total_score.desc,achieved_at.asc&limit=20'};
 await Promise.all(Object.entries(paths).map(async([game,path])=>{try{const rows=await fetchJson(path);state[game]=rows;delete state.errors[game]}catch(e){state.errors[game]=e.message||String(e)}}));state.updated=new Date();state.busy=false;render()}
function addPodium(parent,rows,game){if(!rows.length){parent.append(tag('div','empty','目前還沒有挑戰紀錄，歡迎來挑戰！'));return}const wrap=tag('div','podium');rows.slice(0,3).forEach((r,i)=>{const item=tag('div','podium-item');item.append(tag('div','medal',['🥇','🥈','🥉'][i]),tag('div','pname',r.player_name||'挑戰者'),tag('div','pscore',game==='poetic'?(Number(r.score_tenths)/10).toFixed(1)+' 分':Number(r.total_score)+' 分'),tag('div','extra',game==='poetic'?topicNames[r.topic_id]||r.topic_id||'':chapterNames[r.game_id]||r.game_id||''));wrap.append(item)});parent.append(wrap)}
function addTable(parent,rows,game,start){if(!rows.slice(start,start+10).length){parent.append(tag('div','empty',rows.length?'目前沒有更多排名紀錄':'目前還沒有挑戰紀錄，歡迎來挑戰！'));return}const table=tag('table','rows');const thead=tag('thead'),tr=tag('tr');['名次','玩家暱稱','挑戰題組／篇章','分數'].forEach(x=>tr.append(tag('th','',x)));thead.append(tr);table.append(thead);const body=tag('tbody');rows.slice(start,start+10).forEach((r,i)=>{const row=tag('tr');row.append(tag('td','rank',String(game==='poetic'?r.rank||start+i+1:start+i+1)),tag('td','name',r.player_name||'挑戰者'),tag('td','',game==='poetic'?topicNames[r.topic_id]||r.topic_id||'':chapterNames[r.game_id]||r.game_id||''),tag('td','score',game==='poetic'?(Number(r.score_tenths)/10).toFixed(1)+' 分':Number(r.total_score)+' 分'));body.append(row)});table.append(body);parent.append(table)}
function render(){const slide=slides[state.index],game=slide.game,rows=state[game],name=game==='poetic'?'《詩情畫意》':'《說文解圖》';$('title').textContent=name+' 排行榜';$('subtitle').textContent=game==='poetic'?'月下風情・花意盎然・送別依依｜三題組共用排名':'陋室銘（簡單）・兒時記趣（普通）｜兩篇共用原始分數排名';$('board-title').textContent=slide.type==='podium'?'🏆 文學前三名':`🏅 第 ${slide.start+1}～${slide.start+10} 名`;$('count').textContent=`目前已有 ${rows.length} 筆${rows.length===20?'（最多顯示前20名）':''}`;const content=$('content');content.replaceChildren();if(state.errors[game]&&!rows.length)content.append(tag('div','empty','暫時無法讀取雲端排行榜，請檢查網路連線。'));else if(slide.type==='podium')addPodium(content,rows,game);else addTable(content,rows,game,slide.start);$('status').textContent=state.errors[game]?'⚠️ '+name+' 雲端讀取失敗，顯示上次成功取得的資料':'● 雲端連線正常・定期自動更新';$('status').className='status'+(state.errors[game]?' error':'');$('slide').textContent=(state.index+1)+' / '+slides.length;$('last').textContent=state.updated?'資料更新 '+state.updated.toLocaleTimeString('zh-TW',{hour12:false}):'正在讀取雲端成績'}
function next(){if(state.paused)return;state.index=(state.index+1)%slides.length;state.lastSwitch=Date.now();render()}
function tick(){const fraction=state.paused?0:Math.min(1,(Date.now()-state.lastSwitch)/INTERVAL);$('bar').style.width=(fraction*100)+'%';if(fraction>=1)next()}
$('pause').onclick=()=>{state.paused=!state.paused;$('pause').textContent=state.paused?'繼續輪播':'暫停輪播';state.lastSwitch=Date.now();tick()};$('refresh').onclick=()=>sync();$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{})};
const requested=new URLSearchParams(location.search).get('game');if(requested==='shuowen')state.index=3;
render();sync();setInterval(tick,250);setInterval(sync,REFRESH);document.addEventListener('visibilitychange',()=>{if(!document.hidden){state.lastSwitch=Date.now();sync()}});
</script></body></html>
