:var(--muted);font-size:13px;line-height:1.65}.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.topic{background:#faf5e8;padding:18px 12px;border:2px solid var(--line);border-radius:12px;text-align:center;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:7px}.topic.selected{background:#e6efe7;border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}.topic strong{font-size:20px}.topic small{color:var(--muted)}.error{color:var(--danger);font-weight:bold;min-height:22px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}.pill{padding:7px 12px;background:#eceddc;border:1px solid var(--line);border-radius:100px;font-size:14px}.progress{height:8px;background:#e3dbc8;border-radius:20px;overflow:hidden;margin:13px 0 20px}.progress>div{height:100%;background:var(--jade);transition:width .25s}.art-wrap{display:flex;justify-content:center;align-items:center;min-height:220px;background:#eee8dc;border:1px solid #d6c7aa;border-radius:12px;overflow:hidden;padding:8px}.art-wrap img{display:block;max-width:100%;max-height:min(48dvh,480px);width:auto;height:auto;object-fit:contain}.art-loading{display:flex;align-items:center;justify-content:center;min-height:220px;color:var(--muted)}.clock{text-align:center;font-variant-numeric:tabular-nums;font-size:26px;color:var(--accent);font-weight:bold;padding:13px 0 0}.clock small{font-size:14px;font-weight:normal}.choices{display:grid;gap:10px;margin:17px 0}.choice{border:1px solid #cbbd9f;background:#fffdf8;border-radius:11px;padding:14px 16px;line-height:1.5;text-align:left;font-size:clamp(16px,2.4vw,20px);min-height:59px;color:var(--ink)}.choice:active{background:#e0ebde}.result{background:#f5f0e4;border-left:4px solid var(--jade);padding:17px;border-radius:8px}.result.bad{border-color:#a85c52}.verdict{font-size:clamp(29px,5vw,41px);font-weight:900;line-height:1.35;text-align:center;padding:7px 0 13px}.verdict.bad{color:#b42318}.verdict.good{color:#26704d}.verse{font-size:clamp(20px,3.4vw,27px);color:#385c50;font-weight:bold;line-height:1.6}.score{font-size:clamp(46px,9vw,76px);font-weight:800;color:var(--jade);line-height:1.1}.medal{font-size:27px;color:#8d5d27;font-weight:bold}.scoreline{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px auto}.scoreline span{background:#f4ead6;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.foot{text-align:center;font-size:12px;color:#647067;margin-top:20px}.hidden{display:none!important}@media(max-width:600px){.shell{padding:9px 10px 24px}.paper{margin-top:12px;padding:20px 16px}.mast{padding:6px 2px 12px}.edition{font-size:11px}.topic-grid{grid-template-columns:1fr}.topic{min-height:72px;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 16px}.rules{gap:5px}.rules>div{padding:8px 3px;font-size:12px}.rules strong{font-size:18px}.art-wrap{min-height:175px}.art-wrap img{max-height:40dvh}.actions .btn{flex:1 1 150px}.choice{min-height:54px;padding:11px 13px}}

<script>
'use strict';
const TOPICS=[{"id":"moon","name":"月下風情","folder":"月題組","questions":[{"correct":{"text":"月湧大江流。","author":"杜甫《旅夜書懷》","file":"月湧大江流.png","desc":"大江波濤洶湧，江心倒映滾滾月影，氣勢雄渾磅礴。"},"distractors":["一尊還酹江月。","未央前殿月輪高。","春江花朝秋月夜。","海上生明月。"]},{"correct":{"text":"月落烏啼霜滿天。","author":"張繼《楓橋夜泊》","file":"月落烏啼霜滿天.png","desc":"月亮西沉、烏啼聲冷，滿天霜氣籠罩江楓漁火。"},"distractors":["海上生明月。","唯見江心秋月白。","無言獨上西樓月如鉤。","載月逍遙興欲仙。"]},{"correct":{"text":"江清月近人。","author":"孟浩然《宿建德江》","file":"江清月近人.png","desc":"江水清澈見底，孤舟泊岸，月色宛若親近旅人。"},"distractors":["載月逍遙興欲仙。","一尊還酹江月。","未央前殿月輪高。","春江花朝秋月夜。"]},{"correct":{"text":"床前明月光。","author":"李白《靜夜思》","file":"床前明月光.png","desc":"明亮月光灑落床前窗欞，如秋霜般潔白寒涼。"},"distractors":["春江花朝秋月夜。","海上生明月。","唯見江心秋月白。","無言獨上西樓月如鉤。"]},{"correct":{"text":"煙籠寒水月籠沙。","author":"杜牧《泊秦淮》","file":"煙籠寒水月籠沙.png","desc":"迷濛水氣籠罩寒江，月光如薄紗般灑滿沙岸。"},"distractors":["無言獨上西樓月如鉤。","載月逍遙興欲仙。","一尊還酹江月。","未央前殿月輪高。"]}],"other":7},{"id":"farewell","name":"送別依依","folder":"送別題組","questions":[{"correct":{"text":"主人下馬客在船。","author":"白居易《琵琶行》","file":"主人下馬客在船.png","desc":"主客雙方在江邊依依話別，主人下馬相送，賓客登船啟程，營造出離情依依的動人氛圍。"},"distractors":["潯陽江頭夜送客。","山中相送罷。","相迎不道遠，直至長風沙。","下馬飲君酒，問君何所之。"]},{"correct":{"text":"行行重行行，與君生別離。","author":"《古詩十九首·行行重行行》","file":"行行重行行，與君生別離.png","desc":"一步步漸行漸遠，就此與摯愛／摯友天各一方，飽受生離之苦。"},"distractors":["下馬飲君酒，問君何所之。","山回路轉不見君。","平明送客楚山孤。","望君煙水闊，揮手淚沾巾。"]},{"correct":{"text":"西出陽關無故人。","author":"王維《送元二使安西》","file":"西出陽關無故人.png","desc":"勸君更盡一杯芳醇美酒，向西出了陽關險隘，就再也碰不到舊時相識的故人了。"},"distractors":["望君煙水闊，揮手淚沾巾。","輪臺東門送君去。","金陵子弟來相送。","潯陽江頭夜送客。"]},{"correct":{"text":"故人西辭黃鶴樓。","author":"李白《黃鶴樓送孟浩然之廣陵》","file":"故人西辭黃鶴樓.png","desc":"老友向西告別了黃鶴樓，在繁花如錦的陽春三月，乘舟順流遠赴揚州。"},"distractors":["潯陽江頭夜送客。","山中相送罷。","相迎不道遠，直至長風沙。","下馬飲君酒，問君何所之。"]},{"correct":{"text":"常存抱柱信，豈上望夫臺。","author":"李白《長干行》","file":"常存抱柱信，豈上望夫臺.png","desc":"化用古代尾生抱柱守信的典故，表達女子對遠行丈夫堅貞不二、至死不渝的深情與期盼。"},"distractors":["下馬飲君酒，問君何所之。","山回路轉不見君。","平明送客楚山孤。","望君煙水闊，揮手淚沾巾。"]}],"other":9},{"id":"follow","name":"花意盎然","folder":"花題組","questions":[{"correct":{"text":"朱雀橋邊野草花。","author":"劉禹錫《烏衣巷》","file":"朱雀橋邊野草花.png","desc":"昔日繁華的朱雀橋畔如今長滿了荒草野花，寄託繁華散盡、世事滄桑的歷史感慨。"},"distractors":["來日綺窗前，寒梅著花未。","唯見林花落，鶯啼送客聞。","妾發初覆額，折花門前劇。","映日荷花別樣紅。"]},{"correct":{"text":"夜來風雨聲，花落知多少。","author":"孟浩然《春曉》","file":"夜來風雨聲，花落知多少.png","desc":"春曉醒來想起昨夜傳來的陣陣風雨之聲，不知有多少嬌美春花已被吹打飄落。"},"distractors":["映日荷花別樣紅。","春城無處不飛花。","桃花盡日隨流水。","沾衣欲濕杏花雨。"]},{"correct":{"text":"花自飄零水自流。","author":"李清照《一剪梅》","file":"花自飄零水自流.png","desc":"落花獨自飄散零落，流水自顧潺潺東流，道出一種無可奈何的相思愁苦。"},"distractors":["沾衣欲濕杏花雨。","滿地黃花堆積。","紅藕香殘玉簟秋。","絕好岸梅清鬥月。"]},{"correct":{"text":"待到重陽日，還來就菊花。","author":"孟浩然《過故人莊》","file":"待到重陽日，還來就菊花.png","desc":"故人相約等到秋季重陽佳節之日，定要再次前來共飲美酒、漫賞金菊。"},"distractors":["絕好岸梅清鬥月。","花徑不曾緣客掃。","莫待無花空折枝。","來日綺窗前，寒梅著花未。"]},{"correct":{"text":"採菊東籬下，悠然見南山。","author":"陶淵明《飲酒·其五》","file":"採菊東籬下，悠然見南山.png","desc":"在東側竹籬下悠閒採摘秋菊，抬頭閒適遠眺南山，展現物我兩忘的超然心境。"},"distractors":["來日綺窗前，寒梅著花未。","唯見林花落，鶯啼送客聞。","妾發初覆額，折花門前劇。","映日荷花別樣紅。"]}],"other":12}];
const SUPABASE_URL='https://qxgysajhvqjpogrsutyf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_TvmZX_hhWXlQlxEQ4ejz5Q_UOnwedVP';
const CLOUD_READY=SUPABASE_URL.startsWith('https://')&&SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_');
const VERSION='v1.6.3'; // 雲端計分識別維持 v1.6.3，無須 SQL 更新
const UI_VERSION='v1.6.4';
const app=document.getElementById('app'),homeBtn=document.getElementById('homeBtn');
const boardDialog=document.getElementById('leaderboardDialog');
const music=document.getElementById('backgroundMusic'),musicBtn=document.getElementById('musicBtn');
const MUSIC_URL='../music/background.mp3';
const NICK_STORAGE_KEY='poeticFestivalRememberedNicknameV1';
const isMobileDevice=()=>/Android.*Mobile|iPhone|iPod|Mobile/i.test(navigator.userAgent);
let currentNickname='',musicWanted=false,musicInitialized=false,musicLoading=false,musicUserOverride=false;
music.volume=0.45;
let phase='home',session=null,seq=0,clockHandle=0,loadTimeout=0,selectedTopic='moon';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function topic(){return TOPICS.find(t=>t.id===selectedTopic)}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clearTimers(){clearInterval(clockHandle);clearTimeout(loadTimeout);clockHandle=0;loadTimeout=0}
function elapsed(t){return Math.max(0,(performance.now()-t)/1000)}
function artUrl(folder,file){return './images/'+encodeURIComponent(file.replace(/\.png$/i,'.webp'))}
function getSavedNickname(){try{return localStorage.getItem(NICK_STORAGE_KEY)||''}catch(e){return ''}}
function setSavedNickname(value){try{if(value)localStorage.setItem(NICK_STORAGE_KEY,value);else localStorage.removeItem(NICK_STORAGE_KEY)}catch(e){}}
function updateMusicButton(){
 const active=!music.paused&&!music.ended;
 musicBtn.textContent=active?'♫ 停止音樂':musicWanted?'♫ 等待播放':'♫ 播放音樂';
 musicBtn.setAttribute('aria-pressed',String(active));
 musicBtn.setAttribute('aria-label',active?'停止背景音樂':'播放背景音樂');
 musicBtn.title=musicWanted&&!active?'音樂載入中，或需點擊播放以符合手機瀏覽器限制':'';
}
async function tryPlayMusic(){
 if(!musicWanted||!musicInitialized)return;
 try{await music.play()}catch(e){
   // iOS/Chrome may reject autoplay after an asynchronous image load.
   // Keep the toggle in the "play" state so the user can initiate it with a tap.
   musicWanted=false;
 }
 updateMusicButton();
}
function beginMusicLoad(){
 // Called only after the active artwork has successfully rendered.
 if(musicInitialized)return;
 musicInitialized=true;musicLoading=true;
 music.src=MUSIC_URL;music.preload='auto';music.load();
 music.addEventListener('canplay',()=>{musicLoading=false;if(musicWanted)void tryPlayMusic();},{once:true});
 music.addEventListener('error',()=>{musicLoading=false;musicWanted=false;updateMusicButton();},{once:true});
 if(musicWanted)void tryPlayMusic();
 updateMusicButton();
}
function requestMusicAfterImage(){
 if(!musicWanted)return;
 if(!musicInitialized){beginMusicLoad();return}
 void tryPlayMusic();
}
function toggleMusic(){
 musicUserOverride=true;
 if(!music.paused){music.pause();musicWanted=false;updateMusicButton();return}
 musicWanted=true;
 // Audio may be selected before the first artwork is ready; don't fetch it yet.
 if(musicInitialized)void tryPlayMusic();
